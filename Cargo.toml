[workspace]
members = [
    "crates/rpm-core",
    "crates/rpm-storage",
    "crates/rpm-cli",
    "crates/rpm-gui",
]
resolver = "2"

[workspace.package]
version = "4.5.0"
edition = "2021"
license = "AGPL-3.0-or-later"

[workspace.dependencies]
aes-gcm = "0.10"
argon2 = "0.5"
base64 = "0.22"
bip39 = "2.1"
clap = { version = "4.5", features = ["derive"] }
directories = "6.0"
eframe = "0.37"
flate2 = { version = "1.0", default-features = false, features = ["rust_backend"] }
hkdf = "0.12"
libc = "0.2"
rand = "0.8"
rfd = "0.15"
rpassword = "7.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tar = "0.4"
thiserror = "2.0"
windows-sys = { version = "0.59" }
winreg = "0.55"
zeroize = { version = "1.8", features = ["derive"] }
zxcvbn = "3.1"

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
panic = "abort"

# Keep debug assertions and overflow checks active during tests while
# optimizing crypto, compression, and pure-Rust Reed-Solomon loops and
# keeping debuginfo compact on disk.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = 0

[profile.test]
opt-level = 2
debug = "line-tables-only"
