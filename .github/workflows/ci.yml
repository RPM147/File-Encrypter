name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-lint:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint with ruff
        run: ruff check src tests

      - name: Run pytest
        run: python -m pytest -q

      - name: Entry-point and Vault v4 smoke check
        run: >-
          python -c "import sys; sys.path.insert(0, 'src'); import main;
          from rpm_encrypter.core import VaultCrypto, VAULT_VERSION, SUPPORTED_VAULT_VERSIONS;
          assert VAULT_VERSION == 4 and SUPPORTED_VAULT_VERSIONS == frozenset({4});
          print('SMOKE OK')"
