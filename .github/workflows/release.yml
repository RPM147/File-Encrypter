name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (select the same tag as the workflow ref)
        required: true
        type: string

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  package:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - name: Check release tag
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9A-Za-z][0-9A-Za-z.+-]*$ ]]; then
            echo "Invalid release tag: '$RELEASE_TAG'" >&2
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Verify that the release source matches the workflow commit
        shell: bash
        run: |
          if [[ "$(git rev-parse HEAD)" != "$(git rev-parse --verify "${GITHUB_SHA}^{commit}")" ]]; then
            echo "Run this workflow from the release tag so provenance identifies the built commit." >&2
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux GUI libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libgl1-mesa-dev

      - run: cargo test --workspace
      - run: cargo build --release --workspace

      - name: Package Windows binaries and documentation
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/package-release.ps1 -Version ($env:RELEASE_TAG.Substring(1)) -SkipBuild

      - name: Package Linux binaries and documentation
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          tar -czf "dist/rpm-encrypter-${RELEASE_TAG#v}-linux-x86_64.tar.gz" \
            README.md SECURITY.md LICENSE docs/USER_GUIDE.md docs/USER_GUIDE.tr.md \
            -C target/release rpm-encrypter rpm-encrypter-cli

      - uses: actions/upload-artifact@v7
        with:
          name: package-${{ matrix.os }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error
          compression-level: 0
          overwrite: true

  publish:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Read the tagged version's release notes
        shell: python
        run: |
          import os
          from pathlib import Path

          heading = "## " + os.environ["RELEASE_TAG"]
          lines = Path("CHANGELOG.md").read_text(encoding="utf-8").splitlines()
          matches = [i for i, line in enumerate(lines) if line.rstrip() == heading]
          if len(matches) != 1:
              raise SystemExit(f"Expected one {heading!r} heading in CHANGELOG.md")
          start = matches[0] + 1
          end = next((i for i in range(start, len(lines)) if lines[i].startswith("## ")), len(lines))
          notes = "\n".join(lines[start:end]).strip()
          if not notes:
              raise SystemExit(f"Empty release notes for {heading!r}")
          Path("release-notes.md").write_text(notes + "\n", encoding="utf-8")

      - uses: actions/download-artifact@v8
        with:
          pattern: package-*
          path: dist
          merge-multiple: true

      - name: Calculate archive checksums
        working-directory: dist
        run: sha256sum *.zip *.tar.gz > SHA256SUMS.txt

      - name: Attest the release archives
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS.txt
          create-storage-record: false

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          body_path: release-notes.md
          fail_on_unmatched_files: true
          files: |
            dist/*.zip
            dist/*.tar.gz
            dist/SHA256SUMS.txt
