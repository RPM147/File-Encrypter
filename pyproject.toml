# Project metadata and tooling config for RPM Encrypter.
#
# RPM Encrypter is distributed as a desktop executable built with
#   `flet build windows`  (see build.ps1 and the [tool.flet] section below).
# `flet build` bundles the packages listed in [project.dependencies],
# so that list contains the Flet desktop app's runtime imports only.

[project]
name = "rpm-encrypter"
version = "3.0.0"
description = "Local-only desktop file encryption (AES-256-GCM + Argon2id) with a modern Flet UI."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "RPM Encrypter maintainers" }]
dependencies = [
    "flet==0.85.2",
    "cryptography>=41.0.3",
    "argon2-cffi>=23.1.0",
    "zxcvbn>=4.4.28",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.4.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff.lint]
select = ["E722", "F401", "F821", "F841"]

# ---------------------------------------------------------------------------
# Flet (Flutter) desktop build configuration -- consumed by `flet build windows`.
# Entry point:  src/main.py  ->  rpm_encrypter.ui.app.run()  ->  ft.run(main).
# Output:       build\windows\
# Custom Windows icon lives at src/assets/icon.png (plus launcher/icon.ico).
# ---------------------------------------------------------------------------
[tool.flet]
org = "com.rpmencrypter"
bundle_id = "com.rpmencrypter.app"
product = "RPM Encrypter"
company = "RPM Encrypter"
copyright = "(c) 2026 RPM Encrypter maintainers - AGPL-3.0-or-later"

[tool.flet.app]
path = "src"
module = "main"
